[package]
name = "go-flashcards"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "go_flashcards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# consider removing devtools later
tauri = { version = "2", features = ["devtools"] } 
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.52.3"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
tauri-plugin-fs = "2.5.1"
flate2 = "1.1.9"
rand = "0.10.2"
regex = "1.13.0"
sgf-parse = {
    git = "https://github.com/yahya-tamur/sgf-parse.git"
}
tauri-plugin-dialog = "2.7.1"
struct-patch = "0.12.6"
indexmap = { version = "2.14.0", features = ["serde"] }
toml = { version = "1.1.2", features = ["preserve_order"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
specta = { version = "2.0.0-rc.25", features = ["derive"] }
include_dir = { version = "0.7.4", features = ["glob"] }

# [target.'cfg(windows)'.dependencies]
tauri-plugin-android-fs = "28.4.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
